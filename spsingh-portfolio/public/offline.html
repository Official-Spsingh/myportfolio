<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Shubham Pratap Singh Portfolio</title>
    <style type="text/css">
        body,
        html {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: #0A0A0A;
            color: #F5E8D8;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .offlineContainer {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin: auto;
            position: relative;
        }

        .offlineContainer::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(217, 119, 103, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(181, 147, 91, 0.05) 0%, transparent 40%);
            pointer-events: none;
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        h1.text1 {
            font-size: 3rem;
            font-weight: 900;
            color: #D97767;
            padding: 16px;
            margin: 0;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            filter: drop-shadow(0 0 20px rgba(217, 119, 103, 0.2));
        }

        h2.text2 {
            font-size: 0.9rem;
            font-weight: 700;
            color: #B5935B;
            padding: 8px;
            margin: 0;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            opacity: 1;
        }

        .offline-img {
            width: 200px;
            height: 200px;
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Creative Signal Pulse Animation */
        .pulse-core {
            width: 20px;
            height: 20px;
            background: #D97767;
            border-radius: 50%;
            box-shadow: 0 0 30px #D97767;
            position: relative;
        }

        .pulse-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid #D97767;
            border-radius: 50%;
            opacity: 0;
            animation: pulse-ring 3s cubic-bezier(0.24, 0, 0.38, 1) infinite;
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }

            80%,
            100% {
                transform: scale(5);
                opacity: 0;
            }
        }

        svg.disconnected-icon {
            width: 100%;
            height: 100%;
            position: absolute;
            filter: drop-shadow(0 0 15px rgba(217, 119, 103, 0.4));
        }

        .brand-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: #B5935B;
            margin-bottom: 10px;
            opacity: 0.9;
        }
    </style>
</head>

<body>
    <div class="offlineContainer">
        <div class="wrapper">
            <div class="brand-text">SYSTEM STATUS: INTERRUPTED</div>
            <div class="offline-img">
                <div class="pulse-ring"></div>
                <div class="pulse-core"></div>
                <svg class="disconnected-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22C17.5228 22 22 17.5228 22 12C22 11.3373 21.9351 10.69 21.8113 10.0632"
                        stroke="#D97767" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1 4" />
                    <path d="M4.92896 4.92893C3.12354 6.73435 2 9.23435 2 12" stroke="#D97767" stroke-width="1.5"
                        stroke-linecap="round" />
                    <path d="M19.0711 4.92893C20.8765 6.73435 22 9.23435 22 12" stroke="#D97767" stroke-width="1.5"
                        stroke-linecap="round" opacity="0.3" />
                    <path d="M1 1L23 23" stroke="#F5E8D8" stroke-width="0.5" stroke-linecap="round" />
                </svg>
            </div>
            <h2 class="text2">
                HEY STALKER, IT SEEMS YOU'RE
            </h2>
            <h1 class="text1">
                &lt; OFFLINE /&gt;
            </h1>
            <h2 class="text2">
                PLEASE CHECK YOUR CONNECTION & TRY AGAIN
            </h2>
        </div>
    </div>
</body>

</html>
